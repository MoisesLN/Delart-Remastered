<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <title>{% block titulo %}Delart{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f2f2f2;
        }

        nav, main {
            max-width: 900px;
            margin: auto;
        }

        nav {
            margin-bottom: 20px;
        }

        nav a {
            margin-right: 15px;
        }

        main {
            background: white;
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }

        input, select {
            display: block;
            margin: 5px 0 15px;
            padding: 7px;
        }

        button, .botao {
            padding: 8px 12px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="{{ url_for('cliente.listar') }}">Clientes</a>
        <a href="{{ url_for('funcionario.listar') }}">Funcionários</a>
        <a href="{{ url_for('lavagem.listar') }}">Lavagens</a>
    </nav>

    <main>
        {% block conteudo %}{% endblock %}
    </main>
</body>
</html>
